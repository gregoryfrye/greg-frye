<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HealHaus app — loader</title>
<style>
  /* HealHaus app mockup: the breathing loader. Colors are HealHaus's, sampled from the app's frames,
     not gregfrye.us tokens. The screen is drawn at 320 × 640 and scales to fit (1px = 0.3125cqw). */
  :root {
    --cream: #f2eee3;
    --peach: #f1c4a3;
    --sand: #e3cba9;
    --butter: #f3db9d;
    --ink: #111;
    --faint: #bab7ae;
  }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { display: grid; place-items: center; }
  .phone {
    position: relative; width: min(100vw, 50vh); aspect-ratio: 1 / 2; overflow: hidden;
    container-type: inline-size; background: var(--cream); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* The gradient is fixed to the screen; the breath is a circle revealing it. */
  .fill {
    position: absolute; inset: 0;
    background: linear-gradient(160deg, var(--peach) 0%, var(--sand) 50%, var(--butter) 100%);
    clip-path: circle(0 at 50% 50%);
  }
  .mark { position: absolute; left: 50%; top: 50%; width: 21.4cqw; transform: translate(-50%, -50%); opacity: 0; }
  .arc { position: absolute; left: 50%; top: 50%; width: 37.5cqw; transform: translate(-50%, -50%); overflow: visible; }
  .arc circle { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: butt; }
  .label {
    position: absolute; left: 0; right: 0; bottom: 6.25cqw; text-align: center;
    font: 400 6cqw/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.02em; color: var(--ink);
  }
</style>
</head>
<body>
  <div class="phone" role="img" aria-label="HealHaus app loader: a circle breathes in, holds while a ring draws around the wordmark, then breathes out. Tap to pause.">
    <div class="fill"></div>
    <img class="mark" src="wordmark.png" alt="">
    <svg class="arc" viewBox="-61 -61 122 122" aria-hidden="true">
      <!-- Starts at 9 o'clock and draws clockwise. -->
      <circle r="59" pathLength="100" transform="rotate(180)" stroke-dasharray="0 100"></circle>
    </svg>
    <div class="label">Inhale</div>
  </div>
<script>
  // One breath: inhale 4s, hold 4s, exhale 4s, rest 1s. Tap to pause and resume.
  const fill = document.querySelector(".fill");
  const mark = document.querySelector(".mark");
  const ring = document.querySelector(".arc circle");
  const label = document.querySelector(".label");
  const phone = document.querySelector(".phone");

  const INHALE = 4, HOLD = 4, EXHALE = 4, REST = 1, CYCLE = INHALE + HOLD + EXHALE + REST;
  const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const clamp = (v) => Math.min(1, Math.max(0, v));
  const mix = (a, b, t) => a + (b - a) * t;

  // Radius in cqw: half the screen diagonal reaches the corners.
  const cover = Math.hypot(50, 100);
  function draw(t) {
    let r, markO, arc, word, labelFaint;
    if (t < INHALE) {
      const p = ease(t / INHALE);
      r = mix(0, cover, p);
      markO = clamp((t / INHALE - 0.45) / 0.55);
      arc = 0; word = "Inhale"; labelFaint = t < 0.4;
    } else if (t < INHALE + HOLD) {
      const p = ease((t - INHALE) / HOLD);
      r = cover; markO = 1; arc = p * 100; word = "Hold"; labelFaint = false;
    } else if (t < INHALE + HOLD + EXHALE) {
      const q = (t - INHALE - HOLD) / EXHALE, p = ease(q);
      r = mix(cover, 0, p);
      markO = 1 - clamp(q / 0.7);
      arc = 100 * (1 - clamp(q / 0.6));
      word = "Exhale"; labelFaint = q > 0.9;
    } else {
      r = 0; markO = 0; arc = 0; word = "Exhale"; labelFaint = true;
    }
    fill.style.clipPath = `circle(${r}cqw at 50% 50%)`;
    mark.style.opacity = markO;
    ring.setAttribute("stroke-dasharray", `${arc} 100`);
    if (label.textContent !== word) label.textContent = word;
    label.style.color = labelFaint ? "var(--faint)" : "var(--ink)";
  }

  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) {
    draw(INHALE + HOLD); // the held breath: full field, full ring
  } else {
    let start = performance.now(), paused = false, pausedAt = 0;
    const tick = (now) => {
      if (!paused) draw(((now - start) / 1000) % CYCLE);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    phone.addEventListener("click", () => {
      paused = !paused;
      if (paused) pausedAt = performance.now();
      else start += performance.now() - pausedAt;
    });
  }
</script>
</body>
</html>
